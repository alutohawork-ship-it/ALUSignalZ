<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alu Signal Z</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0e14; color: #e5e7eb; min-height: 100vh; padding: 16px; }
  .hidden { display: none !important; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card { background: #151924; border: 1px solid #232936; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #fff; }
  h2 { font-size: 14px; margin: 0 0 10px; color: #fff; }
  .muted { font-size: 12px; color: #9ca3af; }
  label { display: block; font-size: 12px; color: #9ca3af; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 10px; background: #0b0e14; color: #fff; border: 1px solid #232936; border-radius: 8px; font-size: 14px; }
  button { width: 100%; padding: 10px; margin-top: 10px; border: 0; border-radius: 8px; background: #2962ff; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.danger { background: #7f1d1d; }
  button.small { width: auto; padding: 4px 10px; margin: 0; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .client { background: #0b0e14; border: 1px solid #232936; border-radius: 8px; padding: 8px; margin-top: 6px; }
  .status { font-size: 12px; color: #9ca3af; min-height: 16px; margin-top: 6px; }
  #result { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.6; }
  .buy { color: #38bdf8; font-weight: bold; }
  .sell { color: #f87171; font-weight: bold; }
  .wait { color: #facc15; font-weight: bold; }
  .hist { font-family: ui-monospace, monospace; font-size: 12px; border-top: 1px solid #232936; padding: 6px 0; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="authScreen" class="wrap">
  <div class="card">
    <h1>Welcome, Alu Signal Z</h1>
    <p class="muted">Masukkan email atau kode akses</p>
    <form id="authForm">
      <label>ACCESS LOGIN</label>
      <input id="authInput" type="text" required placeholder="nama@email.com">
      <button type="submit">MASUK SISTEM</button>
    </form>
    <p class="muted" style="margin-top:14px">Bantuan admin: <a href="https://wa.me/6285817038501" style="color:#34d399">+6285817038501</a></p>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen" class="wrap hidden">
  <div class="card">
    <div class="row">
      <div>
        <h2 style="margin:0">Dashboard Admin</h2>
        <p class="muted" style="margin:0">Pendaftaran klien</p>
      </div>
      <button class="small danger" onclick="logout()">KELUAR</button>
    </div>
  </div>
  <div class="card">
    <h2>Daftarkan Klien Baru</h2>
    <label>EMAIL KLIEN</label>
    <input id="newEmail" type="email" placeholder="klien@email.com">
    <label>PAKET</label>
    <select id="newStatus">
      <option value="trial">Trial 3 Hari</option>
      <option value="monthly">Bulanan (30 hari)</option>
      <option value="lifetime">Lifetime</option>
    </select>
    <button onclick="addClient()">SIMPAN & DAFTARKAN</button>
  </div>
  <div class="card">
    <h2>Daftar Klien</h2>
    <div id="clientList"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="wrap hidden">
  <div class="card">
    <div class="row">
      <div>
        <h1>Alu <span style="color:#2962ff">Signal Z</span></h1>
        <p class="muted" style="margin:0" id="userLabel"></p>
      </div>
      <button class="small danger" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <div class="card">
    <label>MARKET</label>
    <select id="market">
      <option value="binance|BTCUSDT">BTC/USDT (Binance)</option>
      <option value="binance|ETHUSDT">ETH/USDT (Binance)</option>
      <option value="binance|SOLUSDT">SOL/USDT (Binance)</option>
      <option value="binance|XRPUSDT">XRP/USDT (Binance)</option>
      <option value="hyperliquid|xyz:GOLD">XAUUSD / Gold (Hyperliquid)</option>
      <option value="hyperliquid|xyz:SILVER">XAGUSD / Silver (Hyperliquid)</option>
    </select>

    <label>GAYA TRADING</label>
    <select id="style">
      <option value="Scalping">Scalping (M1 &amp; M15)</option>
      <option value="Day Trading">Day Trading (M3 &amp; M30)</option>
      <option value="Intraday" selected>Intraday (M5 &amp; H1)</option>
      <option value="Swing">Swing (M15 &amp; H4)</option>
    </select>

    <button id="btn" onclick="generate()">GENERATE AI SIGNAL</button>
    <p class="status" id="status"></p>
  </div>

  <div class="card">
    <div id="result">Pilih market lalu tekan GENERATE.</div>
  </div>

  <div class="card" id="histCard">
    <h2>Sinyal Sesi Ini</h2>
    <div id="histList"><p class="muted">Belum ada sinyal.</p></div>
  </div>
</div>

<script>
// ================= KONFIG =================
const MASTER_ADMIN_PASS = 'GANTI_PASSWORD_ADMIN';
const WS_URL = 'wss://api-stream.myfundedperpetuals.com/v1/market-data';
const CANDLE_BARS = 300;
const CANDLE_MIN = 150;
const STYLE_TF = {
  'Scalping':    { htf: '15m', ltf: '1m' },
  'Day Trading': { htf: '30m', ltf: '3m' },
  'Intraday':    { htf: '1h',  ltf: '5m' },
  'Swing':       { htf: '4h',  ltf: '15m' },
};

// ================= UTIL =================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const getClients = () => { try { return JSON.parse(localStorage.getItem('alu_local_clients') || '[]'); } catch { return []; } };
const saveClients = list => localStorage.setItem('alu_local_clients', JSON.stringify(list));

function showOnly(id) {
  ['authScreen', 'adminScreen', 'appScreen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}

// ================= LOGIN =================
$('authForm').addEventListener('submit', e => {
  e.preventDefault();
  const val = $('authInput').value.trim();
  if (!val) return;

  if (val === MASTER_ADMIN_PASS) {
    localStorage.setItem('alu_session', 'admin');
    return showAdmin();
  }

  const email = val.toLowerCase();
  const clients = getClients();
  let client = clients.find(c => c.email === email);
  if (!client) {
    const ends = new Date();
    ends.setDate(ends.getDate() + 3);
    client = { id: 'client_' + Date.now(), email, status: 'trial', trial_ends_at: ends.toISOString() };
    clients.push(client);
    saveClients(clients);
  }
  if (Date.now() > new Date(client.trial_ends_at).getTime()) {
    return alert('Masa akses sudah berakhir. Hubungi admin.');
  }
  localStorage.setItem('alu_session', 'terminal');
  localStorage.setItem('alu_email', email);
  showApp();
});

function logout() {
  localStorage.removeItem('alu_session');
  localStorage.removeItem('alu_email');
  location.reload();
}

// ================= ADMIN =================
function showAdmin() { showOnly('adminScreen'); renderClients(); }

function addClient() {
  const email = $('newEmail').value.trim().toLowerCase();
  const status = $('newStatus').value;
  if (!email) return alert('Masukkan email klien.');
  const ends = new Date();
  ends.setDate(ends.getDate() + (status === 'trial' ? 3 : status === 'monthly' ? 30 : 3650));
  const clients = getClients();
  clients.push({ id: 'client_' + Date.now(), email, status, trial_ends_at: ends.toISOString() });
  saveClients(clients);
  $('newEmail').value = '';
  renderClients();
}

function deleteClient(id) {
  if (!confirm('Hapus klien ini?')) return;
  saveClients(getClients().filter(c => c.id !== id));
  renderClients();
}

function renderClients() {
  const list = getClients();
  $('clientList').innerHTML = list.length
    ? list.map(c => `
        <div class="client row">
          <div>
            <div style="font-family:ui-monospace,monospace;color:#fff">${esc(c.email)}</div>
            <div class="muted">${esc(c.status)} · s/d ${new Date(c.trial_ends_at).toLocaleDateString('id-ID')}</div>
          </div>
          <button class="small danger" onclick="deleteClient('${esc(c.id)}')">Hapus</button>
        </div>`).join('')
    : '<p class="muted">Belum ada klien.</p>';
}

// ================= APP =================
function showApp() {
  $('userLabel').textContent = localStorage.getItem('alu_email') || '';
  showOnly('appScreen');
}

let ws = null, nextId = 1;
const pending = new Map();

function connectWS() {
  return new Promise((resolve, reject) => {
    const sock = new WebSocket(WS_URL);
    ws = sock;
    const timer = setTimeout(() => reject(new Error('Koneksi stream timeout')), 10000);
    sock.onopen = () => { clearTimeout(timer); resolve(); };
    sock.onerror = () => { clearTimeout(timer); reject(new Error('Tidak bisa terhubung ke stream')); };
    sock.onclose = () => {
      if (ws === sock) ws = null;
      for (const p of pending.values()) p.reject(new Error('Koneksi stream terputus'));
      pending.clear();
    };
    sock.onmessage = e => {
      let f; try { f = JSON.parse(e.data); } catch { return; }
      if ((f.op === 'res' || f.op === 'err') && pending.has(f.id)) {
        const p = pending.get(f.id);
        pending.delete(f.id);
        clearTimeout(p.timer);
        if (f.op === 'res') p.resolve(f.result);
        else p.reject(new Error(f.error?.message || JSON.stringify(f.error)));
      }
    };
  });
}

function wsReq(method, payload, ms = 15000) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return reject(new Error('WS belum tersambung'));
    const id = nextId++;
    const timer = setTimeout(() => {
      if (pending.delete(id)) reject(new Error('timeout ' + method));
    }, ms);
    pending.set(id, { resolve, reject, timer });
    ws.send(JSON.stringify({ op: 'req', id, method, payload }));
  });
}

async function getCandles(provider, symbol, interval) {
  const rows = await wsReq('candles.history', { provider, symbol, interval, limit: CANDLE_BARS });
  if (!Array.isArray(rows)) return [];
  const out = [], seen = new Set();
  for (const x of rows) {
    if (!x || x.isFinal === false) continue; // buang candle yang belum close
    const c = { t: Number(x.openTime), o: Number(x.open), h: Number(x.high), l: Number(x.low), c: Number(x.close) };
    if (![c.t, c.o, c.h, c.l, c.c].every(Number.isFinite)) continue;
    if (seen.has(c.t)) continue;
    seen.add(c.t);
    out.push(c);
  }
  return out.sort((a, b) => a.t - b.t);
}

const setStatus = msg => { $('status').textContent = msg; };

async function generate() {
  const btn = $('btn');
  const [provider, symbol] = $('market').value.split('|');
  const styleName = $('style').value;
  const tf = STYLE_TF[styleName];

  btn.disabled = true;
  $('result').textContent = '';
  try {
    setStatus('Menghubungkan ke stream...');
    if (!ws || ws.readyState !== WebSocket.OPEN) await connectWS();

    setStatus('Mengambil candle...');
    const [htf, ltf] = await Promise.all([
      getCandles(provider, symbol, tf.htf),
      getCandles(provider, symbol, tf.ltf),
    ]);
    if (htf.length < CANDLE_MIN || ltf.length < CANDLE_MIN) {
      throw new Error(`Candle kurang (HTF ${htf.length}, LTF ${ltf.length}, minimal ${CANDLE_MIN}).`);
    }

    setStatus('Menganalisis...');
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        marketId: `${provider}|${symbol}`,
        tradingStyle: styleName,
        currentPrice: ltf[ltf.length - 1].c,
        lang: 'id',
        htf,
        ltf,
      }),
    });
    const raw = await res.json();
    if (!res.ok) throw new Error(raw.error || `HTTP ${res.status}`);

    const content = raw.choices[0].message.content;
    const data = JSON.parse(content.substring(content.indexOf('{'), content.lastIndexOf('}') + 1));
    showResult(data, symbol, styleName);
    setStatus('Selesai.');
  } catch (e) {
    $('result').textContent = 'Error: ' + e.message;
    setStatus('');
  } finally {
    btn.disabled = false;
  }
}

function showResult(d, symbol, styleName) {
  const el = $('result');
  if (d.status !== 'SIGNAL') {
    el.innerHTML = `<span class="wait">WAIT</span>\n${esc(d.reason || '')}`;
    return;
  }
  const sig = String(d.signal || '').toUpperCase();
  const cls = sig === 'BUY' ? 'buy' : 'sell';
  el.innerHTML =
    `<span class="${cls}">${esc(sig)}</span>  grade ${esc(d.grade ?? '-')}  score ${esc(d.score ?? '-')}\n` +
    `Entry : ${esc(d.entry_min)} - ${esc(d.entry_max)}\n` +
    `SL    : ${esc(d.sl)}\n` +
    `TP1   : ${esc(d.tp1)}  (RR ${esc(d.rr_tp1 ?? '-')})\n` +
    `TP2   : ${esc(d.tp2)}\n` +
    `TP3   : ${esc(d.tp3)}\n\n` +
    `${esc(d.reason || '')}`;

  const h = $('histList');
  if (h.querySelector('.muted')) h.innerHTML = '';
  const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
  h.insertAdjacentHTML('afterbegin',
    `<div class="hist"><span class="${cls}">${esc(sig)}</span> ${esc(symbol)} · ${esc(styleName)} · ${time} · entry ${esc(d.entry_min)}</div>`);
}

// ================= BOOT =================
(function boot() {
  const session = localStorage.getItem('alu_session');
  if (session === 'admin') showAdmin();
  else if (session === 'terminal') showApp();
  else showOnly('authScreen');
})();
</script>
</body>
</html>
